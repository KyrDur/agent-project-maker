# Standalone production file. Do NOT merge with docker-compose.yml (public ports).
name: agent-project-maker

x-logging: &rotating-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 512m
    logging: *rotating-logs
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=25
      - -c
      - max_parallel_workers_per_gather=0
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1024m
    logging: *rotating-logs
    # Use the already installed environment; do not sync/install packages at boot.
    command:
      - sh
      - -ec
      - /app/.venv/bin/alembic upgrade head && exec /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
      DB_POOL_SIZE: "3"
      DB_MAX_OVERFLOW: "2"
      CHECKPOINTER_POOL_MIN_SIZE: "1"
      CHECKPOINTER_POOL_MAX_SIZE: "4"
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?Set ENCRYPTION_KEYS}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:?Set API_KEY_HASH_SECRET}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      ALLOW_FIRST_USER_AS_ADMIN: "false"
      E2E_SEED_USER_ENABLED: "false"
      E2E_SCRIPTED_MODEL_ENABLED: "false"
      E2E_TEST_HELPERS_ENABLED: "false"
      DATA_ROOT: /app/data
      SKILL_EVALUATION_MAX_CONCURRENT: "1"
      HEALTH_CHECK_CONCURRENCY: "1"
      LANGFUSE_ENABLED: "false"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).close()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
        NEXT_PUBLIC_CHAT_RUNTIME: langgraph_v3
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 384m
    logging: *rotating-logs
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      NEXT_PUBLIC_CHAT_RUNTIME: langgraph_v3
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=160
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:3000/login',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  backend_data:
