name: Build deployment images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize reruns of a source commit; preserve images already published for it.
concurrency:
  group: deploy-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing source tags
        id: existing
        shell: bash
        run: |
          for service in backend frontend; do
            image="ghcr.io/kyrdur/agent-project-maker-${service}:${GITHUB_SHA}"
            if docker buildx imagetools inspect "$image"; then
              echo "${service}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${service}=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Build and publish backend
        if: steps.existing.outputs.backend != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kyrdur/agent-project-maker-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/KyrDur/agent-project-maker
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish frontend
        if: steps.existing.outputs.frontend != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kyrdur/agent-project-maker-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://agent.softcue.xyz
            NEXT_PUBLIC_CHAT_RUNTIME=langgraph_v3
          labels: |
            org.opencontainers.image.source=https://github.com/KyrDur/agent-project-maker
            org.opencontainers.image.revision=${{ github.sha }}
