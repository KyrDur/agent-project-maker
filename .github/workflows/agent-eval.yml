name: Agent Eval

on:
  pull_request:
    paths:
      - 'agent-eval/**'
      - '.github/workflows/agent-eval.yml'
  push:
    branches: [main]
    paths:
      - 'agent-eval/**'
      - '.github/workflows/agent-eval.yml'

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            agent-eval/EchoMind/requirements.txt
            agent-eval/EchoMind/requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: agent-eval/EchoMindFrontend/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: agent-eval/EchoMind
      - uses: actions/cache@v4
        with:
          path: ~/.cache/chroma/onnx_models/all-MiniLM-L6-v2
          key: agent-eval-minilm-chroma-1.5.5-${{ runner.os }}-${{ runner.arch }}
      - name: Preload public embedding model
        run: python -c "from chromadb.utils.embedding_functions import ONNXMiniLM_L6_V2; ONNXMiniLM_L6_V2(preferred_providers=['CPUExecutionProvider'])(['model initialization'])"
      - name: Run public backend regressions
        run: python -m pytest tests -q -rs
        working-directory: agent-eval/EchoMind
      - name: Install standalone frontend
        run: pnpm install --frozen-lockfile
        working-directory: agent-eval/EchoMindFrontend
      - name: Test and build standalone frontend
        run: |
          pnpm test
          pnpm build
        working-directory: agent-eval/EchoMindFrontend
